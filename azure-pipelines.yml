# Deploys the frontend to Static Web Apps on every push to main.
#
# Set these pipeline variables once (Pipelines -> Edit -> Variables):
#   apiBaseUrl           https://<your-api>.azurewebsites.net
#   supabaseUrl          https://<ref>.supabase.co
#   supabaseAnonKey      the publishable key (safe in the browser by design)
#   swaDeploymentToken   Static Web App -> Manage deployment token (mark as secret)
#
# VITE_ variables are read at build time — Vite bakes them into the bundle.
# Setting them in the Azure portal afterwards has no effect on a static site.

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    displayName: Node 22
    inputs:
      versionSpec: '22.x'

  - script: npm ci
    displayName: Install dependencies

  - script: npm run build
    displayName: Build
    env:
      VITE_API_BASE_URL: $(apiBaseUrl)
      VITE_SUPABASE_URL: $(supabaseUrl)
      VITE_SUPABASE_ANON_KEY: $(supabaseAnonKey)

  - task: AzureStaticWebApp@0
    displayName: Deploy to Static Web Apps
    inputs:
      app_location: dist
      skip_app_build: true
      azure_static_web_apps_api_token: $(swaDeploymentToken)
